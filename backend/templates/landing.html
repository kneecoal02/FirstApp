<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1 id="the_title">Hello this is my SIA project</h1>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io("http://127.0.0.1:5000");
        socket.on("sensor_update", data =>{
            let hhh = document.getElementById("the_title");
            hhh.innerText = data.distance;
        });


    </script>
    
    
</body>
</html>
